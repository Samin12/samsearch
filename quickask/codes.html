<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>2FA codes</title>
<style>
  :root {
    --fg: #f2f2f2; --muted: rgba(255,255,255,.55); --faint: rgba(255,255,255,.08);
    --line: rgba(255,255,255,.1); --accent: #d97757; --sel: rgba(255,255,255,.09);
  }
  @media (prefers-color-scheme: light) {
    :root { --fg: #1d1d1f; --muted: rgba(0,0,0,.5); --faint: rgba(0,0,0,.05); --line: rgba(0,0,0,.1); --sel: rgba(0,0,0,.06); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--fg);
    font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header .key { color: var(--accent); }
  header .title { flex: 1; font-size: 15px; font-weight: 600; }
  label, .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  label { display: flex; align-items: center; gap: 4px; }
  main { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .hit { display: flex; gap: 10px; align-items: center; padding: 9px 8px; border: 0; width: 100%; text-align: left;
    border-radius: 8px; cursor: pointer; background: transparent; color: inherit; font: inherit; }
  .hit.sel, .hit:focus-visible { background: var(--sel); outline: none; }
  .body { min-width: 0; flex: 1; }
  .code { font: 600 26px/1.3 "SFMono-Regular", Menlo, monospace; letter-spacing: 2px; }
  .meta, .sender { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex { color: var(--muted); font-size: 12px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .number { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 24px 12px; text-align: center; }
  .errors { color: var(--muted); font-size: 11.5px; padding: 4px 14px; }
  .errors div { margin: 4px 0; }
  footer { border-top: 1px solid var(--line); padding: 7px 14px; color: var(--muted); font-size: 11.5px; display: flex; gap: 14px; -webkit-user-select: none; }
  #feedback { margin-left: auto; color: var(--accent); }
</style>
</head>
<body>
  <header><span class="key">⌁</span><span class="title">2FA codes</span><span class="count" id="count"></span><label><input type="checkbox" id="older">Show last 24h</label></header>
  <main id="list"><div class="empty">Looking for codes…</div></main>
  <div id="permissions" role="status" style="font-size:11.5px;padding:0 14px"></div>
  <div class="errors" id="errors" role="status"></div>
  <footer><span>↑↓ move</span><span>↵ copy</span><span>⌘1–⌘9 copy</span><span>esc back</span><span id="feedback" role="status"></span></footer>
<script>
  /*BOOT*/
  const B = window.BOOT || {};
  const list = document.getElementById("list"), count = document.getElementById("count"), older = document.getElementById("older");
  const errors = document.getElementById("errors"), feedback = document.getElementById("feedback");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  let hits = [], sel = 0, seq = 0, busy = false, copied = "", controller = null;
  const until = Date.now() + 120000;
  const when = (t) => {
    const seconds = Math.max(0, Math.floor(Date.now() / 1000 - t));
    return seconds < 60 ? "just now" : seconds < 3600 ? `${Math.floor(seconds / 60)} min ago` : `${Math.floor(seconds / 3600)} hr ago`;
  };

  function render() {
    count.textContent = hits.length ? `${hits.length} found` : "";
    if (!hits.length) { list.innerHTML = '<div class="empty">No recent codes found. Waiting for new codes…</div>'; return; }
    const scroll = list.scrollTop;
    list.innerHTML = hits.map((h, i) => `<button class="hit ${i === sel ? "sel" : ""}" data-i="${i}" aria-label="Copy ${esc(h.code)}">
      <div class="body"><div class="code">${esc(h.code)}</div><div class="meta">${esc(h.source)} · ${when(h.time)}</div>
      <div class="sender">${esc(h.sender)}</div><div class="ex">${esc(h.subject || h.snippet)}</div></div>
      <span class="number">${h.id === copied ? "Copied" : i < 9 ? `⌘${i + 1}` : ""}</span></button>`).join("");
    list.scrollTop = scroll;
    list.querySelectorAll(".hit").forEach((el) => { el.onclick = () => { select(+el.dataset.i); copy(); }; });
  }

  function select(i) {
    if (!hits.length) return;
    sel = Math.max(0, Math.min(hits.length - 1, i));
    list.querySelectorAll(".hit").forEach((el) => el.classList.toggle("sel", +el.dataset.i === sel));
    list.querySelector(".hit.sel")?.scrollIntoView({ block: "nearest" });
  }

  async function copy() {
    const h = hits[sel];
    if (!h) return;
    try {
      const response = await fetch("/api/copy", { method: "POST", headers: { "X-QuickAsk": "1", "X-QuickAsk-Token": B.token, "Content-Type": "application/json" }, body: JSON.stringify({ text: h.code }) });
      const r = await response.json();
      if (!response.ok || !r.ok) throw new Error("Clipboard unavailable");
      copied = h.id; feedback.textContent = "Copied"; render();
    } catch (e) { feedback.textContent = `Couldn't copy: ${e.message}`; }
  }

  async function refresh() {
    const my = ++seq;
    controller?.abort();
    controller = new AbortController();
    const current = controller, timeout = setTimeout(() => current.abort(), 12000);
    busy = true;
    try {
      const response = await fetch(`/api/codes?minutes=${older.checked ? 1440 : 30}`, { headers: { "X-QuickAsk": "1" }, signal: current.signal });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const r = await response.json();
      if (my !== seq) return;
      const selected = hits[sel]?.id;
      hits = r.codes || [];
      sel = Math.max(0, hits.findIndex((h) => h.id === selected));
      errors.innerHTML = (r.sources || []).filter((s) => s.error).map((s) => `<div>${esc(s.source)}: ${esc(s.error)}</div>`).join("");
      render();
    } catch (e) { if (my === seq) errors.textContent = `Couldn't refresh codes: ${e.message}`; }
    finally { clearTimeout(timeout); if (my === seq) busy = false; }
  }

  older.onchange = () => { hits = []; sel = 0; list.innerHTML = '<div class="empty">Looking for codes…</div>'; refresh(); };
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1); }
    else if (e.key === "Enter") { e.preventDefault(); copy(); }
    else if (e.metaKey && /^[1-9]$/.test(e.key)) { e.preventDefault(); if (hits[+e.key - 1]) { select(+e.key - 1); copy(); } }
  });
  const timer = setInterval(() => {
    if (Date.now() >= until) { clearInterval(timer); if (!hits.length) list.innerHTML = '<div class="empty">No recent codes found.</div>'; return; }
    if (!busy) refresh();
  }, 5000);
  window.addEventListener("pagehide", () => { clearInterval(timer); controller?.abort(); });
  fetch("/api/status", { headers: { "X-QuickAsk": "1" }, signal: AbortSignal.timeout(3000) }).then((r) => r.json()).then((status) => {
    const denied = [];
    if (status.fullDiskAccess === "denied") denied.push("Quick Ask needs Full Disk Access for Messages in System Settings › Privacy & Security");
    if (status.screenRecording === "denied") denied.push("Quick Ask Screen Recording is not granted");
    for (const [name, state] of Object.entries(status.automation || {})) if (state === "denied") denied.push(`Quick Ask Automation denied for ${name}`);
    document.getElementById("permissions").textContent = denied.join(" · ");
  }).catch(() => {});
  refresh();
</script>
</body>
</html>
