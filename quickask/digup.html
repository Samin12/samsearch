<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DigUp</title>
<style>
  :root {
    --fg: #f2f2f2; --muted: rgba(255,255,255,.55); --faint: rgba(255,255,255,.08);
    --line: rgba(255,255,255,.1); --accent: #d97757; --sel: rgba(255,255,255,.09); --mark: rgba(217,119,87,.28);
  }
  @media (prefers-color-scheme: light) {
    :root { --fg: #1d1d1f; --muted: rgba(0,0,0,.5); --faint: rgba(0,0,0,.05); --line: rgba(0,0,0,.1); --sel: rgba(0,0,0,.06); --mark: rgba(217,119,87,.22); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--fg);
    font: 13.5px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  header .glass { color: var(--accent); }
  input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 15px; }
  header .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
  main { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .hit { display: flex; gap: 10px; align-items: flex-start; padding: 7px 8px; border-radius: 8px; cursor: default; }
  .hit.sel { background: var(--sel); }
  .thumb { width: 44px; height: 44px; border-radius: 6px; flex: none; object-fit: cover; background: var(--faint); }
  .body { min-width: 0; flex: 1; }
  .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ex { color: var(--muted); font-size: 12px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ex mark { background: var(--mark); color: var(--fg); border-radius: 3px; padding: 0 1px; }
  .weak { opacity: .6; }
  .empty { color: var(--muted); padding: 24px 12px; text-align: center; }
  footer { border-top: 1px solid var(--line); padding: 7px 14px; color: var(--muted); font-size: 11.5px; display: flex; gap: 14px; -webkit-user-select: none; }
</style>
</head>
<body>
  <header>
    <span class="glass">⌕</span>
    <input id="q" placeholder="Search your files by what's in them…" autofocus>
    <span class="count" id="count"></span>
  </header>
  <main id="list"><div class="empty">Searching DigUp…</div></main>
  <footer><span>↑↓ move</span><span>↵ open</span><span>⌘R show in Finder</span><span>⇧⌘C copy path</span><span>esc back</span></footer>
<script>
  /*BOOT*/
  const B = window.BOOT || { q: new URLSearchParams(location.search).get("q") || "" };
  const qEl = document.getElementById("q"), list = document.getElementById("list"), count = document.getElementById("count");
  const api = (path, body) => fetch(path, { method: "POST", headers: { "X-QuickAsk": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const HOME = B.home || "";
  let hits = [], sel = 0, seq = 0;

  const ICON = { screenshot: "🖼", image: "🖼", pdf: "📄", doc: "📝", audio: "🎙", video: "🎬", code: "⌨" };
  const when = (t) => (t ? new Date(t * 1000).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "");
  const where = (p) => p.split("/").slice(0, -1).join("/").replace(HOME, "~");
  const thumbable = (k) => k === "screenshot" || k === "image" || k === "pdf" || k === "video";

  function render(strong) {
    count.textContent = hits.length ? `${hits.length} found` : "";
    if (!hits.length) { list.innerHTML = '<div class="empty">Nothing found. Try other words.</div>'; return; }
    list.innerHTML = hits.map((h, i) => {
      const name = h.path.split("/").pop();
      const loc = h.loc && h.kind === "pdf" ? ` · page ${h.loc}` : "";
      const ex = esc(h.excerpt || "").replace(/«(.*?)»/g, "<mark>$1</mark>");
      const pic = thumbable(h.kind)
        ? `<img class="thumb" loading="lazy" src="/thumb?path=${encodeURIComponent(h.path)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb',textContent:''}))">`
        : `<div class="thumb" style="display:grid;place-items:center;font-size:20px">${ICON[h.kind] || "📁"}</div>`;
      return `<div class="hit ${i === sel ? "sel" : ""} ${i >= strong ? "weak" : ""}" data-i="${i}">${pic}<div class="body">
        <div class="name">${esc(name)}</div>
        <div class="meta">${esc(h.kind)} · ${esc(where(h.path))}${loc} · ${when(h.modified)}</div>
        ${ex ? `<div class="ex">${ex}</div>` : ""}</div></div>`;
    }).join("");
    list.querySelectorAll(".hit").forEach((el) => {
      el.onmousemove = () => select(+el.dataset.i);
      el.ondblclick = () => open(false);
      el.onclick = () => select(+el.dataset.i);
    });
  }

  function select(i) {
    if (!hits.length) return;
    sel = Math.max(0, Math.min(hits.length - 1, i));
    list.querySelectorAll(".hit").forEach((el) => el.classList.toggle("sel", +el.dataset.i === sel));
    list.querySelector(".hit.sel")?.scrollIntoView({ block: "nearest" });
  }

  async function search(q) {
    const my = ++seq;
    if (!q.trim()) { hits = []; list.innerHTML = '<div class="empty">Type what you\'re looking for.</div>'; count.textContent = ""; return; }
    count.textContent = "Searching…";
    try {
      const r = await (await api("/api/digup", { q })).json();
      if (my !== seq) return;
      if (r.error) { list.innerHTML = `<div class="empty">${esc(r.error)}</div>`; count.textContent = ""; return; }
      hits = r.hits || [];
      sel = 0;
      render(r.strong ?? hits.length);
    } catch (e) {
      if (my === seq) list.innerHTML = `<div class="empty">Couldn't reach DigUp: ${esc(e)}</div>`;
    }
  }

  function open(reveal) {
    const h = hits[sel];
    if (h) api("/api/open", { path: h.path, reveal });
  }

  let timer;
  qEl.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => search(qEl.value), 250); });
  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1); }
    else if (e.key === "Enter") { e.preventDefault(); open(false); }
    else if (e.metaKey && k === "r") { e.preventDefault(); open(true); }
    else if (e.metaKey && e.shiftKey && k === "c") { e.preventDefault(); if (hits[sel]) api("/api/copy", { text: hits[sel].path }); }
  });

  qEl.value = B.q;
  qEl.focus();
  search(B.q);
</script>
</body>
</html>
