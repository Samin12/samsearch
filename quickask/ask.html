<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quick Ask</title>
<script src="/marked.min.js"></script>
<style>
  :root {
    --fg: #f2f2f2; --muted: rgba(255,255,255,.55); --faint: rgba(255,255,255,.08);
    --line: rgba(255,255,255,.1); --accent: #d97757; --code: rgba(255,255,255,.07);
  }
  @media (prefers-color-scheme: light) {
    :root { --fg: #1d1d1f; --muted: rgba(0,0,0,.5); --faint: rgba(0,0,0,.05); --line: rgba(0,0,0,.1); --code: rgba(0,0,0,.05); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); -webkit-user-select: none; }
  header .title { font-weight: 600; }
  header .chip { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  header .model { color: var(--muted); font-size: 12px; }
  .spark { color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 6px 18px 12px; }
  .turn { padding: 10px 0; border-bottom: 1px solid var(--faint); }
  .turn:last-child { border-bottom: 0; }
  .q { font-weight: 600; margin-bottom: 4px; white-space: pre-wrap; }
  .a p { margin: 6px 0; }
  .a ul, .a ol { margin: 6px 0; padding-left: 22px; }
  .a code { font: 12.5px ui-monospace, "SF Mono", monospace; background: var(--code); padding: 1px 5px; border-radius: 5px; }
  .a pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .a pre code { background: none; padding: 0; }
  .a a { color: var(--accent); }
  .thinking { color: var(--muted); font-style: italic; }
  .note { color: var(--muted); }
  .note b { color: var(--fg); font-weight: 600; }
  .err { color: #ff6b6b; }
  .status { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 4px; }
  .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .links a { display: inline-flex; gap: 6px; align-items: center; max-width: 100%; padding: 3px 9px; border-radius: 7px;
    background: var(--code); color: var(--fg); text-decoration: none; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .links a kbd { font: 11px -apple-system; color: var(--muted); }
  .err code { display: block; margin-top: 4px; color: var(--muted); white-space: pre-wrap; }
  footer { border-top: 1px solid var(--line); padding: 10px 16px 9px; }
  input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 15px; }
  input::placeholder { color: var(--muted); }
  .hints { margin-top: 6px; color: var(--muted); font-size: 11.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; -webkit-user-select: none; }
  .hints .flash { margin-left: auto; color: var(--accent); }
</style>
</head>
<body>
  <header>
    <span class="spark">✦</span><span class="title">Quick Ask</span>
    <span class="chip" id="chip">Looking at your screen…</span>
    <span class="model">Haiku 5.5</span>
  </header>
  <main id="log"></main>
  <div id="permissions" role="status" style="font-size:11.5px;padding:0 14px"></div>
  <footer>
    <input id="inp" placeholder="Ask a follow-up…" autofocus>
    <div class="hints">
      <span>↵ ask</span><span>⌥↵ answer here</span><span id="t3hint">⌘↵ new T3 thread</span>
      <span>⌘1–9 open link in Chrome</span><span>⌘T continue in T3</span><span>⇧⌘C copy</span><span>esc back</span>
      <span class="flash" id="flash"></span>
    </div>
  </footer>
<script>
  /*BOOT*/
  const B = window.BOOT || { q: new URLSearchParams(location.search).get("q") || "", sid: "", floating: false };
  const log = document.getElementById("log"), inp = document.getElementById("inp");
  const chip = document.getElementById("chip"), flashEl = document.getElementById("flash");
  const history = [];
  let busy = false, lastAnswer = "", activeTurn = "", controller = null, moving = false;
  let sessionTimer = null;
  // In SamSearch's panel ⌘↩ belongs to the panel, so a T3 thread from the box is ⌘T there.
  if (!B.floating) document.getElementById("t3hint").remove();

  const headers = { "X-QuickAsk": "1", "X-QuickAsk-Token": B.token, "Content-Type": "application/json" };
  const api = (path, body, options = {}) => fetch(path, { method: "POST", headers, body: JSON.stringify(body), signal: AbortSignal.timeout(5000), ...options });
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const safeURL = (href) => {
    try { const u = new URL(href); return ["http:", "https:", "mailto:"].includes(u.protocol) ? u.href : null; }
    catch { return null; }
  };
  if (window.marked) marked.use({ renderer: {
    html({ text }) { return esc(text); },
    image({ text }) { return esc(text); },
    link({ href, tokens }) {
      const text = this.parser.parseInline(tokens), url = safeURL(href);
      return url ? `<a href="${esc(url)}" rel="noopener noreferrer">${text}</a>` : text;
    },
  } });
  function md(text) {
    if (!window.marked) return esc(text);
    const template = document.createElement("template");
    template.innerHTML = marked.parse(text);
    const allowed = new Set(["P", "BR", "HR", "EM", "STRONG", "DEL", "BLOCKQUOTE", "PRE", "CODE", "UL", "OL", "LI", "H1", "H2", "H3", "H4", "H5", "H6", "TABLE", "THEAD", "TBODY", "TR", "TH", "TD", "A"]);
    for (const el of [...template.content.querySelectorAll("*")]) {
      if (!allowed.has(el.tagName)) { el.replaceWith(document.createTextNode(el.textContent)); continue; }
      const href = el.tagName === "A" ? safeURL(el.getAttribute("href")) : null;
      for (const attr of [...el.attributes]) el.removeAttribute(attr.name);
      if (href) { el.setAttribute("href", href); el.setAttribute("rel", "noopener noreferrer"); }
    }
    return template.innerHTML;
  }
  const scrollDown = () => (log.scrollTop = log.scrollHeight);
  const flash = (t) => { flashEl.textContent = t; setTimeout(() => (flashEl.textContent = ""), 1400); };

  function turn(q) {
    const t = document.createElement("div");
    t.className = "turn";
    t.innerHTML = '<div class="q"></div><div class="a thinking">Thinking…</div><div class="status"></div><div class="links"></div>';
    t.querySelector(".q").textContent = q;
    log.appendChild(t);
    scrollDown();
    return t.querySelector(".a");
  }

  function note(el, html, text) {
    el.className = "a note";
    el.innerHTML = html;
    if (text) el.querySelector("b").textContent = text;
  }

  async function ask(q, mode) {
    if (!q || busy) return;
    busy = true;
    inp.placeholder = "Ask a follow-up…";
    const el = turn(q);
    activeTurn = crypto.randomUUID();
    controller = new AbortController();
    const timeout = setTimeout(() => controller?.abort(), 125000);
    const statusEl = el.parentElement.querySelector(".status");
    const linksEl = el.parentElement.querySelector(".links");
    let text = "";
    try {
      const res = await api("/api/ask", { sid: B.sid, turn: activeTurn, q, mode }, { signal: controller.signal });
      if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "", ended = false;
      while (!ended) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
          if (!line.trim()) continue;
          const m = JSON.parse(line);
          if (m.screen) {
            const s = m.screen;
            chip.textContent = s.ok ? `Sees ${s.app}${s.title && s.title !== s.app ? " — " + s.title : ""}${s.how ? " · " + s.how : ""}` : "Couldn't see the screen (Screen Recording permission)";
          } else if (m.status) {
            statusEl.textContent = m.status + "…";
            text = "";
            el.className = "a thinking";
            el.textContent = "Thinking…";
          } else if (m.d !== undefined) {
            statusEl.textContent = "";
            text += m.d;
            el.className = "a";
            el.innerHTML = md(text);
            scrollDown();
          } else if (m.done) {
            history.push({ q, a: text });
            lastAnswer = text;
            showLinks(el, linksEl);
            ended = true;
          } else if (m.handoff) {
            note(el, "This is real work, so it went to T3 Code.<br>Started a thread: <b></b> ✓", m.handoff);
            ended = true;
          } else if (m.cancelled) {
            el.className = "a note"; el.textContent = "Cancelled"; ended = true;
          } else if (m.error) {
            el.className = "a err";
            el.innerHTML = "Couldn't do that.<code></code>";
            el.querySelector("code").textContent = m.error;
            ended = true;
          }
        }
      }
      if (!ended) throw new Error("The answer connection closed before it finished. Please retry.");
      statusEl.textContent = "";
    } catch (e) {
      statusEl.textContent = "";
      el.className = "a err";
      el.innerHTML = "Couldn't reach Quick Ask.<code></code>";
      el.querySelector("code").textContent = String(e);
    }
    clearTimeout(timeout);
    busy = false; controller = null; activeTurn = "";
    inp.focus();
  }

  // The answer's web links, numbered: ⌘1–⌘9 (or a click) opens one in Chrome.
  let links = [];
  function showLinks(answerEl, box) {
    const seen = new Set();
    links = [...answerEl.querySelectorAll("a[href^='http']")].map((a) => a.href).filter((u) => !seen.has(u) && seen.add(u)).slice(0, 9);
    box.innerHTML = links.map((u, i) => `<a href="${esc(u)}"><kbd>⌘${i + 1}</kbd>${esc(u.replace(/^https?:\/\//, ""))}</a>`).join("");
  }
  const openLink = async (u) => {
    try {
      const response = await api("/api/open-url", { url: u });
      if (!response.ok) throw new Error((await response.json()).error || `HTTP ${response.status}`);
      flash(/^mailto:/i.test(u) ? "Opened mail app" : "Opened in Chrome");
    } catch (e) { flash(e.message); }
  };
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[href]");
    if (!a) return;
    e.preventDefault();
    if (safeURL(a.href)) openLink(a.href);
  });

  async function continueInT3() {
    if (busy) return flash("Wait for the current answer");
    const last = history[history.length - 1];
    if (!last) return flash("Nothing to continue yet");
    const el = turn("Continue in T3 Code");
    note(el, "Starting a thread: <b></b>", last.q);
    busy = true; controller = new AbortController();
    const timeout = setTimeout(() => controller?.abort(), 35000);
    try {
      const response = await api("/api/t3", { sid: B.sid, q: "Continue this for me: " + last.q, title: last.q }, { signal: controller.signal });
      const r = await response.json();
      if (!response.ok || r.error || r.cancelled) throw new Error(r.error || (r.cancelled ? "Cancelled" : `HTTP ${response.status}`));
      el.appendChild(document.createTextNode(" — Started ✓"));
    } catch (e) { el.className = "a err"; el.textContent = String(e); }
    finally { clearTimeout(timeout); controller = null; busy = false; }
  }

  document.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (e.key === "Escape" && B.floating) {
      e.preventDefault();
      window.webkit?.messageHandlers?.qa?.postMessage({ type: "close" });
    } else if (e.key === "Enter" && document.activeElement === inp) {
      e.preventDefault();
      const text = inp.value.trim();
      if (!text) return;
      if (busy) { flash("Your question is kept here until the answer finishes"); return; }
      inp.value = "";
      ask(text, e.metaKey ? "t3" : e.altKey ? "answer" : "auto");
    } else if (e.metaKey && !e.shiftKey && !e.altKey && /^[1-9]$/.test(e.key) && links[+e.key - 1]) {
      e.preventDefault();
      openLink(links[+e.key - 1]);
    } else if (e.metaKey && !e.shiftKey && k === "o" && links[0]) {
      e.preventDefault();
      openLink(links[0]);
    } else if (e.metaKey && !e.shiftKey && k === "t") {
      e.preventDefault();
      continueInT3();
    } else if (e.metaKey && e.shiftKey && k === "c") {
      e.preventDefault();
      if (lastAnswer) api("/api/copy", { text: lastAnswer }).then(() => flash("Copied"));
    }
  });

  // Native SamSearch should evaluate this function for Open Answer Window, then hide its page.
  window.openAnswerWindow = async () => {
    moving = true;
    try {
      const response = await api("/api/float", { sid: B.sid }, { signal: AbortSignal.timeout(5000) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "Couldn't move the conversation");
      return result;
    } catch (e) { moving = false; flash(e.message); throw e; }
  };

  function restore(turns) {
    log.replaceChildren(); history.length = 0; busy = false; activeTurn = "";
    for (const item of turns) {
      const el = turn(item.q);
      if (item.a) { el.className = "a"; el.innerHTML = md(item.a); }
      if (item.state === "done") {
        history.push({ q: item.q, a: item.a }); lastAnswer = item.a;
        showLinks(el, el.parentElement.querySelector(".links"));
      } else if (["cancelled", "error", "handoff"].includes(item.state)) {
        el.className = item.state === "error" ? "a err" : "a note";
        if (item.state === "error") el.textContent = item.detail || "Couldn't finish the answer";
        else if (item.state === "handoff") el.textContent = `Started in T3 Code: ${item.detail}`;
        else if (!item.a) el.textContent = "Cancelled";
      } else { busy = true; activeTurn = item.id; }
    }
    scrollDown();
  }
  async function pollSession() {
    try {
      const response = await fetch(`/api/session?sid=${encodeURIComponent(B.sid)}`, { headers, signal: AbortSignal.timeout(5000) });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      restore((await response.json()).turns || []);
      if (busy) sessionTimer = setTimeout(pollSession, 400);
    } catch (e) {
      chip.textContent = `Couldn't resume the answer: ${e.message}. Retrying…`;
      const answer = log.lastElementChild?.querySelector(".a");
      if (answer && !answer.textContent.trim().replace("Thinking…", "")) { answer.className = "a err"; answer.textContent = "Connection interrupted. Retrying…"; }
      sessionTimer = setTimeout(pollSession, 2000);
    }
  }
  window.addEventListener("pagehide", () => {
    clearTimeout(sessionTimer);
    if (moving) return;
    api("/api/cancel", { sid: B.sid, turn: activeTurn || null, disconnected: !B.floating }, { keepalive: true }).catch(() => {});
    controller?.abort();
  });
  if (B.sid) {
    const url = new URL(location.href); url.searchParams.set("sid", B.sid);
    window.history.replaceState(null, "", url);
  }
  if (B.turns?.length) { restore(B.turns); chip.textContent = busy ? "Answering…" : "Conversation restored"; if (busy) pollSession(); }
  else if (B.q) ask(B.q, "auto");
  else { inp.placeholder = "Ask anything…"; chip.textContent = "Ready"; }
  fetch("/api/status", { headers, signal: AbortSignal.timeout(3000) }).then((r) => r.json()).then((status) => {
    const denied = [];
    if (status.screenRecording === "denied") denied.push("Quick Ask needs Screen Recording in System Settings › Privacy & Security");
    if (status.fullDiskAccess === "denied") denied.push("Quick Ask needs Full Disk Access for Messages");
    for (const [name, state] of Object.entries(status.automation || {})) if (state === "denied") denied.push(`Quick Ask Automation denied for ${name}`);
    document.getElementById("permissions").textContent = denied.join(" · ");
  }).catch(() => {});
  inp.focus();
</script>
</body>
</html>
